
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ily foryou</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #030003;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
}

/* Background glow */
.glow {
    position: absolute;
    width: 260px;
    height: 260px;
    background: #ff168a;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.10;
    animation: glowMove 3s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes glowMove {
    from {
        transform: scale(0.8);
        opacity: 0.06;
    }

    to {
        transform: scale(1.3);
        opacity: 0.15;
    }
}

/* Main wrapper */
.love-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Heart container */
.heart-container {
    position: relative;
    width: min(88vw, 390px);
    aspect-ratio: 1 / 1;
    animation: heartbeat 2.4s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.035);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.045);
    }

    60% {
        transform: scale(1);
    }
}

/* Text following heart outline */
.love-word {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;

    color: #ffb3d9;
    font-size: clamp(7px, 2vw, 11px);
    font-weight: 600;
    letter-spacing: 0.1px;

    text-shadow:
        0 0 4px #ff5eae,
        0 0 8px #ff168a,
        0 0 15px #ff168a;

    opacity: 0;

    animation:
        showText 0.6s ease forwards,
        textGlow 2s ease-in-out infinite alternate;
}

@keyframes showText {
    from {
        opacity: 0;
    }

    to {
        opacity: 0.95;
    }
}

@keyframes textGlow {
    from {
        color: #ffb3d9;
        text-shadow:
            0 0 3px #ff5eae,
            0 0 7px #ff168a;
    }

    to {
        color: #fff0f8;
        text-shadow:
            0 0 5px #ffb3d9,
            0 0 12px #ff168a,
            0 0 20px #ff168a;
    }
}

/* Name */
.name {
    margin-top: -8px;
    position: relative;
    z-index: 2;

    color: #ffb3d9;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;

    text-shadow:
        0 0 5px #ff5eae,
        0 0 10px #ff168a,
        0 0 20px #ff168a;

    animation: nameGlow 2s ease-in-out infinite alternate;
}

@keyframes nameGlow {
    from {
        opacity: 0.7;
        text-shadow:
            0 0 5px #ff5eae,
            0 0 10px #ff168a;
    }

    to {
        opacity: 1;
        text-shadow:
            0 0 8px #ffb3d9,
            0 0 16px #ff168a,
            0 0 25px #ff168a;
    }
}

/* Music button */
.music-button {
    position: fixed;
    z-index: 10;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    padding: 12px 22px;
    border: 1px solid rgba(255, 140, 200, 0.6);
    border-radius: 30px;

    background: rgba(255, 22, 138, 0.12);
    color: #ffc4e1;

    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;

    box-shadow:
        0 0 10px rgba(255, 22, 138, 0.2),
        inset 0 0 10px rgba(255, 22, 138, 0.05);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.music-button:active {
    transform: translateX(-50%) scale(0.95);
}

.music-icon {
    font-size: 17px;
}

.music-button.playing {
    animation: musicGlow 1.5s ease-in-out infinite alternate;
}

@keyframes musicGlow {
    from {
        box-shadow: 0 0 8px rgba(255, 22, 138, 0.2);
    }

    to {
        box-shadow:
            0 0 18px rgba(255, 22, 138, 0.5),
            0 0 30px rgba(255, 22, 138, 0.15);
    }
}

/* Floating hearts */
.particle {
    position: absolute;
    bottom: -30px;
    color: #ff72ba;
    pointer-events: none;

    text-shadow:
        0 0 5px #ff168a,
        0 0 10px #ff168a;

    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }
}

/* Mobile responsive */
@media (max-width: 480px) {
    .heart-container {
        width: 94vw;
    }

    .love-word {
        font-size: 7px;
    }

    .name {
        font-size: 20px;
        letter-spacing: 1.5px;
    }

    .music-button {
        bottom: 24px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .heart-container,
    .glow,
    .name {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="love-wrapper">

    <div class="heart-container" id="heart"></div>

    <div class="name">
        RAYHAN ARRIANNUR
    </div>

</div>

<!-- Music -->
<audio id="backgroundMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Music control -->
<button class="music-button" id="musicButton" type="button">
    <span class="music-icon" id="musicIcon">♫</span>
    <span id="musicText">PLAY OUR MUSIC</span>
</button>

<script>
const heart = document.getElementById("heart");

/* Create heart outline */
const totalWords = 180;
const points = [];

for (let i = 0; i < totalWords; i++) {

    const t = (i / totalWords) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    points.push({ x, y });
}

const minX = Math.min(...points.map(p => p.x));
const maxX = Math.max(...points.map(p => p.x));
const minY = Math.min(...points.map(p => p.y));
const maxY = Math.max(...points.map(p => p.y));

points.forEach((point, i) => {

    const word = document.createElement("span");

    word.className = "love-word";
    word.textContent = "I love you";

    const left =
        9 + ((point.x - minX) / (maxX - minX)) * 82;

    const top =
        8 + ((maxY - point.y) / (maxY - minY)) * 84;

    word.style.left = left + "%";
    word.style.top = top + "%";

    word.style.animationDelay =
        (i * 0.018) + "s, " +
        (Math.random() * 2) + "s";

    heart.appendChild(word);
});

/* Floating hearts and sparkles */
function createParticle() {

    const particle = document.createElement("span");

    particle.className = "particle";

    const symbols = ["♡", "♥", "✦", "·"];

    particle.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    particle.style.left = Math.random() * 100 + "vw";

    particle.style.fontSize =
        (8 + Math.random() * 13) + "px";

    const duration = 4 + Math.random() * 5;

    particle.style.animationDuration = duration + "s";

    document.body.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, duration * 1000);
}

setInterval(createParticle, 400);

/* Music autoplay and controls */
const music = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");
const musicIcon = document.getElementById("musicIcon");
const musicText = document.getElementById("musicText");

function updateMusicButton(isPlaying) {

    if (isPlaying) {
        musicIcon.textContent = "♫";
        musicText.textContent = "MUSIC PLAYING";
        musicButton.classList.add("playing");
    } else {
        musicIcon.textContent = "♫";
        musicText.textContent = "PLAY OUR MUSIC";
        musicButton.classList.remove("playing");
    }
}

async function playMusic() {
    try {
        await music.play();
        updateMusicButton(true);
    } catch (error) {
        updateMusicButton(false);
        console.log("Autoplay blocked. Tap the music button to play.");
    }
}

// Attempt autoplay when the page loads
window.addEventListener("load", () => {
    playMusic();
});

// Play or pause when the button is clicked
musicButton.addEventListener("click", async () => {

    if (music.paused) {
        await playMusic();
    } else {
        music.pause();
        updateMusicButton(false);
    }
});

music.addEventListener("play", () => updateMusicButton(true));
music.addEventListener("pause", () => updateMusicButton(false));

</script>

</body>
</html>
